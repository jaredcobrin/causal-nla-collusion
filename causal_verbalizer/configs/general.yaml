# General concepts for the verbalizer: what to detect, where the contrast data comes from.
#
# A concept is a general idea (not "Apple Pay vs Google Pay"). Its positives are the union of several
# independent sources, so we can hold one source out and test whether the direction still fires on it
# (leave-one-source-out). Negatives are texts of other concepts, length-matched.
#
# registry: id -> a public dataset and the column that holds the class (cv audit: scripts/audit_sources.py)
# concepts: name -> group, and `pos`: [source:value, ...] meaning "rows of that source whose class is value".
# `gen` marks concepts that need generated data (no public dataset): they are built with Claude subagents
# from templates and listed as AMBER/RED in the audit until written.

registry:
  # text: format string over the row's columns. cls: where the class comes from (col; names = int -> name;
  # multi = list column; thr = float column bucketed into high/low; beaver = BeaverTails category dict).
  # --- news / topic -------------------------------------------------------------------------------------
  ag:        {hf: fancyzhx/ag_news,                         split: train,     text: "{text}",                                  cls: {col: label}}
  ng:        {hf: SetFit/20_newsgroups,                     split: train,     text: "{text}",                                  cls: {col: label_text}}
  yh:        {hf: community-datasets/yahoo_answers_topics,  split: train,     text: "{question_title} {question_content}",    cls: {col: topic}}
  bbc:       {hf: SetFit/bbc-news,                          split: train,     text: "{text}",                                  cls: {col: label_text}}
  tw:        {hf: cardiffnlp/tweet_topic_single,            split: train_all, text: "{text}",                                  cls: {col: label_name}}
  nc:        {hf: heegyu/news-category-dataset,             split: train,     text: "{headline}. {short_description}",         cls: {col: category}}
  fintopic:  {hf: zeroshot/twitter-financial-news-topic,    split: train,     text: "{text}",                                  cls: {col: label, names: [Analyst Update, Fed | Central Banks, Company | Product News, Treasuries | Corporate Debt, Dividend, Earnings, Energy | Oil, Financials, Currencies, General News | Opinion, Gold | Metals | Materials, IPO, Legal | Regulation, M&A | Investments, Macro, Markets, Politics, Personnel Change, Stock Commentary, Stock Movement]}}
  arxiv:     {hf: ccdv/arxiv-classification,                split: train,     text: "{text}",                                  cls: {col: label}}
  dbp:       {hf: fancyzhx/dbpedia_14, ordered: true,       split: train,     text: "{content}",                               cls: {col: label}}
  mmlu:      {hf: cais/mmlu, config: all,                   split: test,      text: "{question}",                              cls: {col: subject}}
  medmcqa:   {hf: openlifescienceai/medmcqa,                split: train,     text: "{question}",                              cls: {col: subject_name}}
  # --- chat tasks / intents -----------------------------------------------------------------------------
  norobots:  {hf: HuggingFaceH4/no_robots,                  split: train,     text: "{prompt}",                                cls: {col: category}}
  dolly:     {hf: databricks/databricks-dolly-15k,          split: train,     text: "{instruction}",                           cls: {col: category}}
  massive:   {hf: mteb/amazon_massive_scenario, config: en, split: train,     text: "{text}",                                  cls: {col: label_text}}
  clinc:     {hf: clinc/clinc_oos, config: plus,            split: train,     text: "{text}",                                  cls: {col: intent}}
  trec:      {hf: SetFit/TREC-QC,                           split: train,     text: "{text}",                                  cls: {col: label_coarse_text}}
  dailydlg:  {hf: roskoN/dailydialog,                       split: train,     per_item: {text: utterances, cls: acts, names: [none, inform, question, directive, commissive]}, text: "", cls: {col: acts}}
  empathic:  {hf: Estwld/empathetic_dialogues_llm,          split: train,     text: "{situation}",                             cls: {col: emotion}}
  # --- sentiment / emotion / style ----------------------------------------------------------------------
  sst2:      {hf: stanfordnlp/sst2,                         split: train,     text: "{sentence}",                              cls: {col: label}}
  imdb:      {hf: stanfordnlp/imdb,                         split: train,     text: "{text}",                                  cls: {col: label}}
  yelp:      {hf: fancyzhx/yelp_polarity,                   split: train,     text: "{text}",                                  cls: {col: label, names: [negative, positive]}}
  amzpol:    {hf: fancyzhx/amazon_polarity,                 split: train,     text: "{title}. {content}",                      cls: {col: label}}
  emotion:   {hf: dair-ai/emotion, config: split,           split: train,     text: "{text}",                                  cls: {col: label}}
  goemo:     {hf: google-research-datasets/go_emotions, config: simplified, split: train, text: "{text}",                    cls: {col: labels, multi: true}}
  formality: {hf: osyvokon/pavlick-formality-scores,        split: train,     text: "{sentence}",                              cls: {col: avg_score, thr: {high: 1.5, low: -1.5}}}
  polite:    {hf: Intel/polite-guard,                       split: train,     text: "{text}",                                  cls: {col: label}}
  sarcasm:   {hf: raquiba/Sarcasm_News_Headline,            split: train,     text: "{headline}",                              cls: {col: is_sarcastic, names: [not_sarcastic, sarcastic]}}
  irony:     {hf: cardiffnlp/tweet_eval, config: irony,     split: train,     text: "{text}",                                  cls: {col: label, names: [non_irony, irony]}}
  subj:      {hf: SetFit/subj,                              split: train,     text: "{text}",                                  cls: {col: label_text}}
  jokes:     {hf: Fraser/short-jokes, trust: true, cap: 1000, split: train,  text: "{text}",                                  cls: {const: joke}}
  # --- safety / model behaviour -------------------------------------------------------------------------
  beaver:    {hf: PKU-Alignment/BeaverTails, trust: true,   split: 330k_train, text: "{prompt}",                             cls: {beaver: true}}
  harmful:   {hf: mlabonne/harmful_behaviors,               split: train,     text: "{text}",                                  cls: {const: harmful_instruction}}
  jailbreak: {hf: jackhhao/jailbreak-classification,        split: train,     text: "{prompt}",                                cls: {col: type}}
  inject:    {hf: deepset/prompt-injections,                split: train,     text: "{text}",                                  cls: {col: label, names: [benign, injection]}}
  toxchat:   {hf: lmsys/toxic-chat, config: toxicchat0124,  split: train,     text: "{user_input}",                            cls: {col: toxicity, names: [non_toxic, toxic]}}
  civil:     {hf: google/civil_comments,                    split: train,     text: "{text}",                                  cls: {col: toxicity, thr: {high: 0.7, low: 0.05}}}
  hate:      {hf: cardiffnlp/tweet_eval, config: hate,      split: train,     text: "{text}",                                  cls: {col: label, names: [non_hate, hate]}}
  offensive: {hf: cardiffnlp/tweet_eval, config: offensive, split: train,     text: "{text}",                                  cls: {col: label, names: [non_offensive, offensive]}}
  # --- form / language / content ------------------------------------------------------------------------
  lang:      {hf: papluca/language-identification,          split: train,     text: "{text}",                                  cls: {col: labels}}
  gsm8k:     {hf: openai/gsm8k, config: main, cap: 1000,               split: train,     text: "{question}",                              cls: {const: math_word_problem}}
  tinystory: {hf: roneneldan/TinyStories, cap: 1000,                   split: train,     text: "{text}",                                  cls: {const: story}}
  wiki:      {hf: wikimedia/wikipedia, config: 20231101.en, cap: 1000, split: train,     text: "{text}",                                  cls: {const: encyclopedia}}
  code:      {hf: codeparrot/codeparrot-clean-valid, cap: 1000,        split: train,     text: "{content}",                               cls: {const: source_code}}
  mnli:      {hf: nyu-mll/multi_nli,                        split: train,     text: "{premise}",                               cls: {col: genre}}
  # --- second sources added to make concepts testable across independent datasets -----------------------
  pku:       {hf: PKU-Alignment/PKU-SafeRLHF,               split: train,     text: "{prompt}",                                cls: {pku: true}}
  itw_jb:    {hf: TrustAIRLab/in-the-wild-jailbreak-prompts, split: train, cap: 250, text: "{prompt}", cls: {const: x}, configs: {jailbreak: jailbreak_2023_12_25, benign: regular_2023_12_25}}
  inject2:   {hf: xTRam1/safe-guard-prompt-injection,       split: train,     text: "{text}",                                  cls: {col: label, names: [benign, injection]}}
  tw_emotion: {hf: cardiffnlp/tweet_eval, config: emotion,  split: train,     text: "{text}",                                  cls: {col: label}}
  dd_emo:    {hf: roskoN/dailydialog,                       split: train,     per_item: {text: utterances, cls: emotions, names: [none, anger, disgust, fear, happiness, sadness, surprise]}, text: "", cls: {col: emotions}}
  sst5:      {hf: SetFit/sst5,                              split: train,     text: "{text}",                                  cls: {col: label_text}}
  tse:       {hf: mteb/tweet_sentiment_extraction,          split: train,     text: "{text}",                                  cls: {col: label_text}}
  fever:     {hf: copenlu/fever_gold_evidence,              split: train,     text: "{claim}",                                 cls: {col: label, drop: [NOT ENOUGH INFO]}}
  wikilang:  {hf: wikimedia/wikipedia, split: train, cap: 250, text: "{text}", cls: {const: x}, configs: {en: 20231101.en, es: 20231101.es, fr: 20231101.fr, de: 20231101.de, zh: 20231101.zh, ja: 20231101.ja, ar: 20231101.ar, ru: 20231101.ru}}
