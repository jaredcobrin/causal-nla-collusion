# Transfer test scenarios (cv/transfer.py): free-form chats that look nothing like the multiple-choice
# prompts the directions were built on. Per concept: 10 prompts where the model's own reply should
# not show the concept (steering targets) and 10 where it should (removal / negative-steering
# targets). `expect` is only the intent; the judged unsteered reply decides which side a prompt is on.
#
#   target   what the judge scores 0-100 ("how clearly the reply <target>")
#   up/down  first-reply-token words tied to the concept / to its opposite (probability mass is logged)
#   sys      optional system prompt; turns = user, assistant, user, ... (ends on a user turn)
#   source   where the direction comes from (cv/transfer.py loads the saved one or rebuilds it)

ag-technology:
  source: bank
  plain: {hf: fancyzhx/ag_news, split: train, label: 3, n: 1000, max_words: 100}
  target: "is about technology: computers, software, the internet, electronics, or AI"
  up: [Here, To, Sure, Debug, Python, Technology]
  down: [The, In, A, Pr, Spring]
  prompts:
    - {expect: absent, turns: ["What's the best way to prune an apple tree in late winter?"]}
    - {expect: absent, turns: ["Tell me about the causes of the French Revolution."]}
    - {expect: absent, turns: ["Write a haiku about autumn rain."]}
    - {expect: absent, turns: ["Give me a recipe for vegetarian lasagna that serves six."]}
    - {expect: absent, sys: "You are an excitable sports commentator.", turns: ["Describe a last-minute penalty kick in the final."]}
    - {expect: absent, turns: ["How many calories should an adult eat per day, and how do I estimate mine?"]}
    - {expect: absent, turns: ["My toddler won't sleep through the night. Any advice?"]}
    - {expect: absent, turns: ["I'm writing a poem about the sea.", "Lovely! What kind of poem?", "A sad one. Give me the first stanza."]}
    - {expect: absent, turns: ["What is the difference between a violin and a viola?"]}
    - {expect: absent, turns: ["Explique-moi pourquoi les feuilles changent de couleur en automne."]}
    - {expect: present, turns: ["My Python script throws KeyError: 'id'. How do I debug it?"]}
    - {expect: present, turns: ["Should I buy a MacBook Air or a ThinkPad for programming?"]}
    - {expect: present, turns: ["Explain what a neural network is to a high-school student."]}
    - {expect: present, turns: ["How does end-to-end encryption work in messaging apps?"]}
    - {expect: present, sys: "You are a helpful IT support assistant.", turns: ["My Wi-Fi router keeps rebooting every few minutes."]}
    - {expect: present, turns: ["What's new in smartphone camera sensors this year?"]}
    - {expect: present, turns: ["Write a SQL query that returns the top 5 customers by total order value."]}
    - {expect: present, turns: ["Why is my laptop battery draining so fast since the update?"]}
    - {expect: present, turns: ["Describe how GPS satellites work out where you are."]}
    - {expect: present, turns: ["Give me a short overview of how large language models are trained."]}

